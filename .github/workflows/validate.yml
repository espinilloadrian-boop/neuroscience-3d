name: Validación del atlas
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/atlas-manifest-timeout
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación
        run: npm run build
